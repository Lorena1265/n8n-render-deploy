services:
  - type: web
      name: n8n
      env: docker
      plan: free
      region: oregon
      envVars:
        - key: DB_TYPE
        value: postgresdb
        - key: DB_POSTGRESDB_DATABASE
        value: postgres
        - key: DB_POSTGRESDB_HOST
        sync: false
        - key: DB_POSTGRESDB_PORT
        value: 5432
        - key: DB_POSTGRESDB_USER
        value: postgres.ldtggultualvdtyszhgd
        - key: DB_POSTGRESDB_PASSWORD
        sync: false
        - key: WEBHOOK_URL
        sync: false
        - key: N8N_ENCRYPTION_KEY
        generateValue: true
